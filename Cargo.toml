[package]
name = "max_authorization_challenge"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pqcrypto-sphincsplus = "=0.7.2"
pqcrypto-traits = "0.3"
sha2 = "0.11.0"
base64 = "0.23.1"
fs2 = "0.4.3"
tiny_http = "0.12.0"
ctrlc = { version = "3.4", features = ["termination"] }
