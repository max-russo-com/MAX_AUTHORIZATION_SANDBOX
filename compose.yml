services:
  sandbox:
    image: max-authorization-sandbox:local
    environment:
      CHALLENGE_SECRET:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - max-auth-state:/app/state

volumes:
  max-auth-state:
